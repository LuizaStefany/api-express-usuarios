<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Usuários</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/usuarios.js" defer></script>
</head>
<body>
  <main>
    <h1>Gerenciador de Usuários</h1>
    <form id="formulario">
      <label for="nome">Nome do usuário</label>
      <div class="entrada">
        <input id="nome" name="nome" placeholder="Digite um nome" required>
        <button type="submit">Adicionar</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="usuarios"></ul>
    <p class="nota">Os dados são temporários e voltam ao estado inicial quando o servidor reinicia.</p>
    <a href="/usuarios">Ver JSON da API</a>
  </main>
</body>
</html>
